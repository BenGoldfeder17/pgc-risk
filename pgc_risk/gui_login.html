<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pgc-risk</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --text-primary: #0b0b0b; --text-secondary: #52514e;
  --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10); --accent: #2a78d6; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --axis: #383835; --border: rgba(255, 255, 255, 0.10); --accent: #3987e5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 48px 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
       color: var(--text-primary); background: var(--plane); }
main { max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border);
       border-radius: 12px; padding: 24px; }
h1 { font-size: 24px; margin: 0 0 6px; font-weight: 650; }
p { margin: 0 0 16px; color: var(--text-secondary); font-size: 15px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; font-size: 26px; letter-spacing: 0.3em; text-align: center; padding: 10px;
        border-radius: 8px; border: 1px solid var(--axis); background: var(--plane); color: var(--text-primary); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 14px; font: inherit; font-weight: 600; padding: 11px; border-radius: 8px;
         border: 0; background: var(--accent); color: #fff; cursor: pointer; }
#msg { min-height: 1.5em; margin: 12px 0 0; color: var(--text-primary); font-size: 14.5px; }
#msg.bad::before { content: "! "; font-weight: 700; color: var(--critical); }
</style>
</head>
<body>
<main>
  <h1>pgc-risk</h1>
  <p>Enter the access code shown by pgc-risk on the computer __HOST__ (in its browser page and its console window).</p>
  <form id="form" autocomplete="off">
    <label for="code">Access code</label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus required>
    <button type="submit">Continue</button>
  </form>
  <div id="msg" role="alert"></div>
</main>
<script>
"use strict";
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "";
  msg.textContent = "Checking";
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({code: document.getElementById("code").value})});
    if (r.ok) { location.reload(); return; }
    const body = await r.json().catch(() => ({}));
    msg.className = "bad";
    msg.textContent = body.error || "Not accepted.";
  } catch (err) {
    msg.className = "bad";
    msg.textContent = "The computer running pgc-risk did not answer.";
  }
});
</script>
</body>
</html>
